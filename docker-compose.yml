services:
  mage248_php:
    image: php:8.3.19-fpm
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: mage248_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html/
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    ports:
      - "9001:9000"
    networks:
      - magento248_nets

  mage248_nginx:
    image: nginx:1.18
    container_name: mage248_nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx:rw
    depends_on:
      - mage248_php
    networks:
      - magento248_nets

  mage248_mysql:
    image: mysql:8.0.41
    container_name: mage248_mysql
    restart: "no"
    command: 
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento123
      MYSQL_DATABASE: magento
    ports:
      - "3307:3306"
    volumes:
      - ./db_data:/var/lib/mysql:rw
    networks:
      - magento248_nets

  mage248_valkey:
    image: valkey/valkey:8
    container_name: mage248_valkey
    ports:
      - "6379:6379"
    networks:
      - magento248_nets

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: mage248_opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Mage248@OS3X
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./osdata:/usr/share/opensearch/data
    networks:
      - magento248_nets

  mage248_phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: mage248_phpmyadmin
    restart: "no"
    environment:
      PMA_HOST: mage248_mysql
      PHP_MEMORY_LIMIT: 1024M
    ports:
      - "81:80"
    networks:
      - magento248_nets

networks:
  magento248_nets:
